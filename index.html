<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatHub - 网页聊天平台</title>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1239/gun.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1239/sea.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1239/lib/radix.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1239/lib/radisk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1239/lib/store.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1239/lib/rindexed.js"></script>
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #818cf8;
    --bg-main: #0f172a;
    --bg-sidebar: #1e293b;
    --bg-chat: #1e293b;
    --bg-input: #334155;
    --bg-message-self: #6366f1;
    --bg-message-other: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: #334155;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }
  /* ============ Auth Pages ============ */
  .auth-container {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
    position: relative;
    overflow: hidden;
  }
  .auth-container::before {
    content: "";
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
    border-radius: 50%;
    top: -200px; left: -200px;
    animation: float 8s ease-in-out infinite;
  }
  .auth-container::after {
    content: "";
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(168,85,247,0.12) 0%, transparent 70%);
    border-radius: 50%;
    bottom: -150px; right: -150px;
    animation: float 10s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-30px) translateX(20px); }
  }
  .auth-card {
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 20px;
    padding: 40px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative;
    z-index: 1;
  }
  .auth-logo { text-align: center; margin-bottom: 30px; }
  .auth-logo .logo-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
    border-radius: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
  }
  .auth-logo h1 {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #818cf8, #c4b5fd);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .auth-logo p { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block; font-size: 13px; color: var(--text-secondary);
    margin-bottom: 6px; font-weight: 500;
  }
  .form-group input {
    width: 100%; padding: 12px 14px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary); font-size: 14px;
    transition: all 0.2s;
  }
  .form-group input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  .form-group input::placeholder { color: var(--text-muted); }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .auth-switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary); }
  .auth-switch a { color: var(--primary-light); text-decoration: none; font-weight: 600; cursor: pointer; }
  .auth-switch a:hover { text-decoration: underline; }
  .auth-error, .auth-success {
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .auth-error {
    background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;
  }
  .auth-error.show, .auth-success.show { display: block; }
  .auth-success {
    background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7;
  }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
    border-radius: 50%; animation: spin 0.6s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .conn-badge {
    position: fixed; top: 12px; right: 12px;
    background: rgba(30,41,59,0.9); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 20px; font-size: 11px; z-index: 50;
    display: flex; align-items: center; gap: 6px;
  }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
  .conn-dot.online { background: var(--success); }

  /* ============ Chat Layout ============ */
  .chat-app { display: none; height: 100vh; grid-template-columns: 300px 1fr; }
  .chat-app.show { display: grid; }
  .sidebar {
    background: var(--bg-sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header {
    padding: 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-header .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600; font-size: 16px; flex-shrink: 0;
  }
  .user-info .user-name { font-weight: 600; font-size: 15px; }
  .user-info .user-status {
    font-size: 12px; color: var(--success);
    display: flex; align-items: center; gap: 4px;
  }
  .user-status::before {
    content: ""; width: 7px; height: 7px; background: var(--success);
    border-radius: 50%; display: inline-block;
  }
  .icon-btn {
    background: transparent; border: none; color: var(--text-secondary);
    cursor: pointer; padding: 8px; border-radius: 8px; transition: all 0.2s; font-size: 18px;
  }
  .icon-btn:hover { background: rgba(148, 163, 184, 0.1); color: var(--text-primary); }
  .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .sidebar-tab {
    flex: 1; padding: 12px; background: transparent; border: none;
    color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all 0.2s; border-bottom: 2px solid transparent;
  }
  .sidebar-tab.active { color: var(--primary-light); border-bottom-color: var(--primary); }
  .sidebar-tab:hover:not(.active) { background: rgba(148, 163, 184, 0.05); color: var(--text-primary); }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
  .sidebar-list::-webkit-scrollbar { width: 6px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .list-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border-radius: 10px; cursor: pointer; transition: background 0.15s; margin-bottom: 2px;
  }
  .list-item:hover { background: rgba(148, 163, 184, 0.08); }
  .list-item.active { background: rgba(99, 102, 241, 0.15); }
  .list-item .item-content { flex: 1; min-width: 0; }
  .list-item .item-name {
    font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-item .item-last {
    font-size: 12px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .list-item .item-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .list-item .badge {
    background: var(--primary); color: white; font-size: 11px;
    padding: 2px 6px; border-radius: 10px; margin-left: 6px;
  }
  .online-dot { position: relative; }
  .online-dot::after {
    content: ""; position: absolute; bottom: 2px; right: 2px;
    width: 10px; height: 10px; background: var(--success);
    border: 2px solid var(--bg-sidebar); border-radius: 50%;
  }
  .offline-dot::after { background: var(--text-muted); }
  .empty-list { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 13px; }

  /* Chat Area */
  .chat-area { display: flex; flex-direction: column; background: var(--bg-chat); overflow: hidden; }
  .chat-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: var(--bg-sidebar);
  }
  .chat-header .chat-title { font-weight: 600; font-size: 16px; }
  .chat-header .chat-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .message {
    display: flex; gap: 10px; max-width: 70%;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.self { align-self: flex-end; flex-direction: row-reverse; }
  .message .avatar { width: 32px; height: 32px; font-size: 13px; }
  .message-content { display: flex; flex-direction: column; gap: 4px; }
  .message.self .message-content { align-items: flex-end; }
  .message-meta {
    font-size: 11px; color: var(--text-muted);
    display: flex; gap: 6px; align-items: center;
  }
  .message-meta .sender { font-weight: 600; color: var(--text-secondary); }
  .message-bubble {
    background: var(--bg-message-other); padding: 10px 14px;
    border-radius: 16px; border-bottom-left-radius: 4px;
    font-size: 14px; line-height: 1.5; word-break: break-word;
  }
  .message.self .message-bubble {
    background: var(--bg-message-self);
    border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; color: white;
  }
  .message.system .message-bubble {
    background: transparent; color: var(--text-muted);
    font-size: 12px; text-align: center; margin: 0 auto; font-style: italic;
  }
  .message.system { align-self: center; max-width: 100%; }
  .message.system .message-meta { display: none; }
  .empty-chat {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; color: var(--text-muted); gap: 16px;
  }
  .empty-chat .empty-icon { font-size: 64px; opacity: 0.4; }
  .empty-chat h3 { font-size: 18px; color: var(--text-secondary); }

  /* Input Area */
  .chat-input {
    padding: 14px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end; background: var(--bg-sidebar);
  }
  .chat-input textarea {
    flex: 1; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; color: var(--text-primary);
    font-size: 14px; font-family: inherit; resize: none;
    max-height: 120px; min-height: 42px; transition: border-color 0.2s;
  }
  .chat-input textarea:focus { outline: none; border-color: var(--primary); }
  .send-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border: none; color: white; width: 42px; height: 42px;
    border-radius: 12px; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-sidebar); border-radius: 16px; padding: 24px;
    width: 90%; max-width: 360px; box-shadow: var(--shadow);
  }
  .modal h3 { margin-bottom: 16px; font-size: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; }
  .btn-secondary { background: var(--bg-input); color: var(--text-primary); }
  .btn-danger { background: var(--danger); color: white; }

  /* Toast */
  .toast {
    position: fixed; top: 20px; right: 20px;
    background: var(--bg-sidebar); border: 1px solid var(--border);
    padding: 12px 18px; border-radius: 10px; box-shadow: var(--shadow);
    z-index: 200; transform: translateX(400px); transition: transform 0.3s ease;
    font-size: 14px; max-width: 320px;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .chat-app { grid-template-columns: 1fr; }
    .sidebar {
      position: absolute; top: 0; left: 0; bottom: 0;
      width: 80%; max-width: 300px; z-index: 10;
      transform: translateX(-100%); transition: transform 0.3s;
    }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle { display: block !important; }
    .message { max-width: 85%; }
    .auth-card { padding: 28px 20px; }
  }
  .menu-toggle {
    display: none; background: transparent; border: none;
    color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 6px;
  }
  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 5; }
  .backdrop.show { display: block; }
  .typing-indicator {
    font-size: 12px; color: var(--text-muted);
    padding: 4px 8px; font-style: italic; display: none;
  }
  .typing-indicator.show { display: block; }
</style>
</head>
<body>

<!-- ============ Auth: Login ============ -->
<div id="loginPage" class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">💬</div>
      <h1>ChatHub</h1>
      <p>欢迎回来，请登录继续聊天</p>
    </div>
    <div id="loginError" class="auth-error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginUsername">用户名</label>
        <input type="text" id="loginUsername" placeholder="请输入用户名" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPassword">密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
    </form>
    <div class="auth-switch">
      还没有账号？ <a onclick="showRegister()">立即注册</a>
    </div>
  </div>
</div>

<!-- ============ Auth: Register ============ -->
<div id="registerPage" class="auth-container" style="display:none;">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">💬</div>
      <h1>创建账号</h1>
      <p>加入 ChatHub，开始跨设备聊天</p>
    </div>
    <div id="registerError" class="auth-error"></div>
    <div id="registerSuccess" class="auth-success"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="regUsername">用户名</label>
        <input type="text" id="regUsername" placeholder="3-20位字符，字母/数字/下划线" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="regNickname">昵称</label>
        <input type="text" id="regNickname" placeholder="显示给其他用户的名称" required maxlength="20" autocomplete="nickname">
      </div>
      <div class="form-group">
        <label for="regPassword">密码</label>
        <input type="password" id="regPassword" placeholder="至少6位密码" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="regPasswordConfirm">确认密码</label>
        <input type="password" id="regPasswordConfirm" placeholder="再次输入密码" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="registerBtn">注 册</button>
    </form>
    <div class="auth-switch">
      已有账号？ <a onclick="showLogin()">返回登录</a>
    </div>
  </div>
</div>

<!-- ============ Chat App ============ -->
<div id="chatApp" class="chat-app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="user-info">
        <div class="avatar" id="myAvatar">U</div>
        <div>
          <div class="user-name" id="myNickname">用户</div>
          <div class="user-status">在线</div>
        </div>
      </div>
      <button class="icon-btn" onclick="confirmLogout()" title="退出登录">⏻</button>
    </div>
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="chats" onclick="switchTab('chats')">聊天</button>
      <button class="sidebar-tab" data-tab="users" onclick="switchTab('users')">在线用户</button>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>

  <main class="chat-area">
    <div class="chat-header" id="chatHeader" style="display:none;">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="avatar" id="chatAvatar" style="display:none;">#</div>
      <div style="flex:1;">
        <div class="chat-title" id="chatTitle">选择一个聊天</div>
        <div class="chat-subtitle" id="chatSubtitle"></div>
      </div>
    </div>

    <div id="emptyState" class="empty-chat">
      <div class="empty-icon">💬</div>
      <h3>开始你的第一次聊天</h3>
      <p>从左侧选择一个聊天或在线用户开始对话</p>
    </div>

    <div id="messagesContainer" class="messages" style="display:none;"></div>
    <div id="typingIndicator" class="typing-indicator"></div>

    <div class="chat-input" id="chatInput" style="display:none;">
      <textarea id="messageInput" placeholder="输入消息，按 Enter 发送（Shift+Enter 换行）" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<!-- Logout Modal -->
<div class="modal-overlay" id="logoutModal">
  <div class="modal">
    <h3>退出登录</h3>
    <p style="color: var(--text-secondary); font-size: 14px;">确定要退出登录吗？你的聊天记录将保留在此设备上。</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeLogoutModal()">取消</button>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>
  </div>
</div>

<!-- Connection Badge -->
<div class="conn-badge" id="connBadge">
  <span class="conn-dot" id="connDot"></span>
  <span id="connText">连接中…</span>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ====================================================================
 * ChatHub v2 - 跨设备网页聊天平台
 * 架构：Gun.js (去中心化 P2P 数据库) + SEA (加密)
 * 后端：公开 relay peer (relay.peer.ooo)，无需注册
 * 支持：注册/登录、公共聊天室、私聊、在线用户、跨设备实时消息
 * ==================================================================== */

// 多 relay 冗余配置，断线自动切换
const RELAYS = [
  'https://relay.peer.ooo/gun',
  'https://gun-manhattan.herokuapp.com/gun',
  'https://gun-relay-mlccl.ondigitalocean.app/gun',
];

let gun = null;
let sea = null;
let currentUser = null;            // { username, nickname, pub, epub, pair }
let currentChat = { type: null, target: null };
let currentTab = 'chats';
let typingTimeout = null;
let heartbeatInterval = null;
let presenceCleanupInterval = null;
let onlineUsers = {};              // { username: { nickname, pub, lastSeen } }
let publicMessages = [];           // [{ id, sender, senderNickname, text, ts }]
let privateConvs = {};             // { otherUser: [{...message}] }
let renderedPublicIds = new Set(); // 已渲染过的公共消息 id，避免重复
let renderedPrivateIds = new Set();
let lastTypingSignal = 0;

// ============ 工具函数 ============
function getInitials(name) {
  if (!name) return '?';
  return name.charAt(0).toUpperCase();
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (isToday) return time;
  return `${d.getMonth()+1}/${d.getDate()} ${time}`;
}

function escapeHtml(str) {
  if (str == null) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 2800);
}

function setConnStatus(online, text) {
  const dot = document.getElementById('connDot');
  const txt = document.getElementById('connText');
  dot.classList.toggle('online', !!online);
  txt.textContent = text || (online ? '已连接' : '连接中…');
}

// 用 SEA 加密 password 作为"密码哈希"——不存原密码
async function hashPassword(password) {
  // 用 password 加密一个固定字符串，得到稳定哈希
  const enc = await SEA.encrypt('chathub-v1', password);
  return enc;
}

async function verifyPassword(password, hash) {
  try {
    const dec = await SEA.decrypt(hash, password);
    return dec === 'chathub-v1';
  } catch { return false; }
}

// ============ Gun 初始化 ============
function initGun() {
  if (gun) return;
  gun = Gun({
    peers: RELAYS,
    localStorage: 'chathub-local',   // 本地缓存
    radisk: true,
  });
  sea = SEA;

  // 连接状态监听
  const mesh = gun.back('opt.mesh') || {};
  let anyConn = false;
  // 任何节点出现/消失时更新徽标
  setInterval(() => {
    const peers = gun.back('opt.peers') || {};
    const alive = Object.values(peers).some(p => p && p.wire && p.wire.readyState === 1);
    setConnStatus(alive, alive ? '已连接' : '连接中…');
  }, 2000);
}

// ============ 注册系统（基于 SEA）============
async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>注册中…';

  const username = document.getElementById('regUsername').value.trim();
  const nickname = document.getElementById('regNickname').value.trim();
  const password = document.getElementById('regPassword').value;
  const passwordConfirm = document.getElementById('regPasswordConfirm').value;

  document.getElementById('registerError').classList.remove('show');
  document.getElementById('registerSuccess').classList.remove('show');

  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
    showAuthError('registerError', '用户名需为3-20位字母、数字或下划线');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }
  if (!nickname) {
    showAuthError('registerError', '请输入昵称');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }
  if (password.length < 6) {
    showAuthError('registerError', '密码至少6位');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }
  if (password !== passwordConfirm) {
    showAuthError('registerError', '两次输入的密码不一致');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }

  initGun();

  // 1. 检查用户名是否已存在
  const existing = await new Promise(resolve => {
    gun.get('chathub').get('users').get(username.toLowerCase()).once(v => resolve(v), {wait: 1500});
  });

  if (existing && existing.passwordHash) {
    showAuthError('registerError', '该用户名已被注册');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }

  // 2. 创建 SEA 密钥对
  const pair = await SEA.pair();
  const passwordHash = await hashPassword(password);

  const userRecord = {
    username,
    nickname,
    passwordHash,
    pub: pair.pub,
    epub: pair.epub,
    createdAt: Date.now(),
  };

  // 3. 写入 Gun 图数据库
  gun.get('chathub').get('users').get(username.toLowerCase()).put(userRecord);

  const successEl = document.getElementById('registerSuccess');
  successEl.textContent = `注册成功！欢迎，${nickname}。正在跳转登录…`;
  successEl.classList.add('show');

  setTimeout(() => {
    document.getElementById('registerForm').reset();
    document.getElementById('loginUsername').value = username;
    showLogin();
    btn.disabled = false;
    btn.textContent = '注 册';
  }, 1500);
}

// ============ 登录系统 ============
async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>登录中…';

  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  document.getElementById('loginError').classList.remove('show');
  initGun();

  // 1. 读取用户记录
  const userRecord = await new Promise(resolve => {
    let done = false;
    gun.get('chathub').get('users').get(username.toLowerCase()).once(v => {
      if (!done) { done = true; resolve(v); }
    }, {wait: 2500});
    setTimeout(() => { if (!done) { done = true; resolve(null); } }, 3000);
  });

  if (!userRecord || !userRecord.passwordHash) {
    showAuthError('loginError', '用户名不存在，请先注册');
    btn.disabled = false; btn.textContent = '登 录'; return;
  }

  // 2. 校验密码
  const ok = await verifyPassword(password, userRecord.passwordHash);
  if (!ok) {
    showAuthError('loginError', '密码错误');
    btn.disabled = false; btn.textContent = '登 录'; return;
  }

  // 3. 恢复 SEA 密钥对（基于用户名+密码）
  // 由于我们不存储 priv/epriv，需要重新派生——但 SEA 的 pair 是随机生成的
  // 所以我们存储了 pub/epub，但 priv/epriv 需要"密码+salt"派生
  // 简化处理：注册时也存一份 pair 在加密形式（用 password 加密）
  // 这里我们直接拿存储的 pub/epub 用于身份，私聊加密用 senderNickname 即可
  // 真正严格的端到端加密需要派生 pair，但为了演示可用性，我们简化为不加密私聊内容
  // 若需要 E2EE，可在注册时存储 password 加密的 pair，登录时解出

  currentUser = {
    username: userRecord.username,
    nickname: userRecord.nickname,
    pub: userRecord.pub,
    epub: userRecord.epub,
  };

  // 4. 持久化会话（localStorage 仅存登录态，不含密钥）
  localStorage.setItem('chathub_session', JSON.stringify({
    username: currentUser.username,
    nickname: currentUser.nickname,
    pub: currentUser.pub,
    epub: currentUser.epub,
    ts: Date.now(),
  }));

  // 5. 上线广播 + 进入聊天
  announcePresence(true);
  enterChatApp();
  startListening();
  startHeartbeat();

  btn.disabled = false;
  btn.textContent = '登 录';
}

// ============ 在线状态 ============
function announcePresence(online) {
  if (!currentUser || !gun) return;
  const info = {
    username: currentUser.username,
    nickname: currentUser.nickname,
    pub: currentUser.pub,
    lastSeen: Date.now(),
    online: !!online,
  };
  // 写到 presence 节点
  gun.get('chathub').get('presence').get(currentUser.username).put(info);
  // 在线用户列表由全局监听器更新
}

function startHeartbeat() {
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(() => {
    announcePresence(true);
  }, 15000);

  if (presenceCleanupInterval) clearInterval(presenceCleanupInterval);
  presenceCleanupInterval = setInterval(() => {
    cleanupStalePresence();
  }, 10000);
}

function cleanupStalePresence() {
  const now = Date.now();
  let changed = false;
  for (const [u, info] of Object.entries(onlineUsers)) {
    if (u === currentUser.username) continue;  // 自己永远算在线
    if (now - info.lastSeen > 30000 && info.online) {
      info.online = false;
      changed = true;
    }
  }
  if (changed) {
    if (currentTab === 'users') renderSidebarList();
    updateChatHeaderStatus();
  }
}

// ============ 监听 Gun 实时数据 ============
function startListening() {
  // 1. 监听所有在线用户（presence 节点）
  // 用 .once() 先加载所有历史 presence 数据，再 .on() 监听新增/更新
  gun.get('chathub').get('presence').map().once((data, key) => {
    if (!data || !data.username) return;
    const isSelf = data.username === currentUser.username;
    onlineUsers[data.username] = {
      username: data.username,
      nickname: data.nickname,
      pub: data.pub,
      lastSeen: data.lastSeen || Date.now(),
      online: isSelf ? true : data.online,
    };
  });
  // 然后监听实时更新
  gun.get('chathub').get('presence').map().on((data, key) => {
    if (!data || !data.username) return;
    const isSelf = data.username === currentUser.username;
    onlineUsers[data.username] = {
      username: data.username,
      nickname: data.nickname,
      pub: data.pub,
      lastSeen: data.lastSeen || Date.now(),
      online: isSelf ? true : data.online,
    };
    // 自动更新 UI
    if (currentTab === 'users') renderSidebarList();
    updateChatHeaderStatus();
  });
  // 给 .once() 一点时间，然后刷新一次 UI
  setTimeout(() => {
    cleanupStalePresence();
    if (currentTab === 'users') renderSidebarList();
    updateChatHeaderStatus();
  }, 3000);
  // 定期重新扫描（防止遗漏）
  setInterval(() => {
    gun.get('chathub').get('presence').map().once((data, key) => {
      if (!data || !data.username) return;
      const isSelf = data.username === currentUser.username;
      if (!onlineUsers[data.username] || (Date.now() - (onlineUsers[data.username].lastSeen || 0) < 60000 && !onlineUsers[data.username].online)) {
        onlineUsers[data.username] = {
          username: data.username,
          nickname: data.nickname,
          pub: data.pub,
          lastSeen: data.lastSeen || Date.now(),
          online: isSelf ? true : data.online,
        };
      }
    });
  }, 20000);

  // 2. 监听公共聊天消息——用 .once() 加载历史，.on() 接收新消息
  gun.get('chathub').get('public_chat').map().once((data, key) => {
    if (!data || !data.id || renderedPublicIds.has(data.id)) return;
    renderedPublicIds.add(data.id);
    publicMessages.push(data);
    publicMessages.sort((a, b) => (a.ts || 0) - (b.ts || 0));
  });
  gun.get('chathub').get('public_chat').map().on((data, key) => {
    if (!data || !data.id || renderedPublicIds.has(data.id)) return;
    renderedPublicIds.add(data.id);
    publicMessages.push(data);
    publicMessages.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    if (currentChat.type === 'public') {
      renderMessages();
      renderSidebarList();
    } else {
      showToast(`${data.senderNickname || data.sender}: ${data.text.substring(0, 30)}`);
      renderSidebarList();
    }
  });
  // 给历史加载留时间，然后刷新 UI
  setTimeout(() => {
    if (currentChat.type === 'public') renderMessages();
    renderSidebarList();
  }, 3000);

  // 3. 监听私聊消息
  // 用 .once() 加载历史 + .on() 接收新消息
  gun.get('chathub').get('private').get(currentUser.username).map().once((data, key) => {
    if (!data || !data.id) return;
    const convKey = data.conversationKey;
    if (!convKey) return;
    const otherUser = data.sender === currentUser.username ? data.recipient : data.sender;
    if (!privateConvs[otherUser]) privateConvs[otherUser] = [];
    const convId = `${convKey}:${data.id}`;
    if (renderedPrivateIds.has(convId)) return;
    renderedPrivateIds.add(convId);
    privateConvs[otherUser].push(data);
    privateConvs[otherUser].sort((a, b) => (a.ts || 0) - (b.ts || 0));
  });
  gun.get('chathub').get('private').get(currentUser.username).map().on((data, key) => {
    if (!data || !data.id) return;
    const convKey = data.conversationKey;
    if (!convKey) return;
    const otherUser = data.sender === currentUser.username ? data.recipient : data.sender;
    if (!privateConvs[otherUser]) privateConvs[otherUser] = [];
    const convId = `${convKey}:${data.id}`;
    if (renderedPrivateIds.has(convId)) return;
    renderedPrivateIds.add(convId);
    privateConvs[otherUser].push(data);
    privateConvs[otherUser].sort((a, b) => (a.ts || 0) - (b.ts || 0));

    if (currentChat.type === 'private' && currentChat.target === otherUser) {
      renderMessages();
      renderSidebarList();
    } else {
      if (data.sender !== currentUser.username) {
        showToast(`${data.senderNickname || data.sender} 给你发了一条私信`);
      }
      renderSidebarList();
    }
  });
  setTimeout(() => {
    if (currentChat.type === 'private') renderMessages();
    renderSidebarList();
  }, 3000);

  // 4. 监听正在输入信号
  gun.get('chathub').get('typing').map().on((data, key) => {
    if (!data || !data.user) return;
    if (currentChat.type === 'private' && currentChat.target === data.user) {
      const ind = document.getElementById('typingIndicator');
      if (data.typing && data.user !== currentUser.username) {
        ind.textContent = `${data.nickname || data.user} 正在输入…`;
        ind.classList.add('show');
      } else {
        ind.classList.remove('show');
      }
    }
  });
}

// ============ 发送消息 ============
function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text) return;

  const message = {
    id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6),
    sender: currentUser.username,
    senderNickname: currentUser.nickname,
    text,
    ts: Date.now(),
  };

  if (currentChat.type === 'public') {
    // 写入公共聊天节点
    gun.get('chathub').get('public_chat').get(message.id).put(message);
    // 本地立即显示（监听会触发，但这里也手动加一下避免延迟）
    renderedPublicIds.add(message.id);
    publicMessages.push(message);
    publicMessages.sort((a, b) => (a.ts || 0) - (b.ts || 0));
    renderMessages();
  } else if (currentChat.type === 'private') {
    const otherUser = currentChat.target;
    const conversationKey = [currentUser.username, otherUser].sort().join('|');
    message.recipient = otherUser;
    message.conversationKey = conversationKey;
    // 写入 sender 视角节点 & recipient 视角节点（双方都能监听到）
    gun.get('chathub').get('private').get(currentUser.username).get(message.id).put(message);
    gun.get('chathub').get('private').get(otherUser).get(message.id).put(message);
    // 本地立即显示
    const convId = `${conversationKey}:${message.id}`;
    renderedPrivateIds.add(convId);
    if (!privateConvs[otherUser]) privateConvs[otherUser] = [];
    privateConvs[otherUser].push(message);
    privateConvs[otherUser].sort((a, b) => (a.ts || 0) - (b.ts || 0));
    renderMessages();
  }

  input.value = '';
  autoResize(input);
  renderSidebarList();
}

// ============ 正在输入信号 ============
function handleTyping() {
  if (currentChat.type !== 'private') return;
  const now = Date.now();
  if (now - lastTypingSignal < 1500) return;  // 节流
  lastTypingSignal = now;
  gun.get('chathub').get('typing').get(currentUser.username).put({
    user: currentUser.username,
    nickname: currentUser.nickname,
    typing: true,
    ts: now,
  });
  if (typingTimeout) clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    gun.get('chathub').get('typing').get(currentUser.username).put({
      user: currentUser.username,
      nickname: currentUser.nickname,
      typing: false,
      ts: Date.now(),
    });
  }, 2000);
}

// ============ UI 渲染 ============
function enterChatApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('registerPage').style.display = 'none';
  document.getElementById('chatApp').classList.add('show');

  document.getElementById('myNickname').textContent = currentUser.nickname;
  document.getElementById('myAvatar').textContent = getInitials(currentUser.nickname);

  renderSidebarList();
  openPublicChat();
}

function showRegister() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('registerPage').style.display = 'flex';
  document.getElementById('registerError').classList.remove('show');
  document.getElementById('registerSuccess').classList.remove('show');
}

function showLogin() {
  document.getElementById('registerPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginError').classList.remove('show');
}

function showAuthError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.classList.add('show');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderSidebarList();
}

function renderSidebarList() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';

  if (currentTab === 'chats') {
    // 公共聊天室
    const publicItem = document.createElement('div');
    publicItem.className = 'list-item' + (currentChat.type === 'public' ? ' active' : '');
    publicItem.onclick = () => openPublicChat();
    const lastMsg = publicMessages[publicMessages.length - 1];
    publicItem.innerHTML = `
      <div class="avatar" style="background: linear-gradient(135deg, #10b981, #059669);">#</div>
      <div class="item-content">
        <div class="item-name">公共聊天室</div>
        <div class="item-last">${lastMsg ? escapeHtml(lastMsg.text.substring(0, 30)) : '欢迎大家来聊天'}</div>
      </div>
      <div class="item-time">${lastMsg ? formatTime(lastMsg.ts).split(' ')[0] : ''}</div>
    `;
    list.appendChild(publicItem);

    // 私聊会话列表
    const privateUsers = Object.keys(privateConvs).filter(u => privateConvs[u].length > 0);
    if (privateUsers.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-list';
      empty.textContent = '还没有私聊，点击「在线用户」开始私聊';
      list.appendChild(empty);
    } else {
      for (const otherUser of privateUsers) {
        const msgs = privateConvs[otherUser] || [];
        const lastPriv = msgs[msgs.length - 1];
        const onlineInfo = onlineUsers[otherUser];
        const nickname = (onlineInfo && onlineInfo.nickname) || (msgs[0] && msgs[0].senderNickname) || otherUser;
        const isActive = currentChat.type === 'private' && currentChat.target === otherUser;
        const item = document.createElement('div');
        item.className = 'list-item' + (isActive ? ' active' : '');
        item.onclick = () => openPrivateChat(otherUser);
        item.innerHTML = `
          <div class="avatar">${getInitials(nickname)}</div>
          <div class="item-content">
            <div class="item-name">${escapeHtml(nickname)}</div>
            <div class="item-last">${lastPriv ? escapeHtml((lastPriv.sender === currentUser.username ? '我: ' : '') + lastPriv.text.substring(0, 25)) : ''}</div>
          </div>
          <div class="item-time">${lastPriv ? formatTime(lastPriv.ts).split(' ')[0] : ''}</div>
        `;
        list.appendChild(item);
      }
    }
  } else if (currentTab === 'users') {
    cleanupStalePresence();
    const others = Object.values(onlineUsers).filter(u => u.username !== currentUser.username && u.online !== false && (Date.now() - (u.lastSeen || 0) < 60000));
    if (others.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-list';
      empty.textContent = '当前没有其他在线用户，邀请朋友注册吧！';
      list.appendChild(empty);
      return;
    }
    for (const info of others) {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.onclick = () => openPrivateChat(info.username);
      item.innerHTML = `
        <div class="avatar online-dot">${getInitials(info.nickname)}</div>
        <div class="item-content">
          <div class="item-name">${escapeHtml(info.nickname)}</div>
          <div class="item-last" style="color: var(--success);">在线</div>
        </div>
      `;
      list.appendChild(item);
    }
  }
}

function openPublicChat() {
  currentChat = { type: 'public', target: null };
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('messagesContainer').style.display = 'flex';
  document.getElementById('chatInput').style.display = 'flex';
  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('chatAvatar').style.display = 'none';

  document.getElementById('chatTitle').textContent = '公共聊天室';
  const count = Object.keys(onlineUsers).length;
  document.getElementById('chatSubtitle').textContent = `${count} 人在线`;

  renderSidebarList();
  renderMessages();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

function openPrivateChat(targetUser) {
  const info = onlineUsers[targetUser];
  const lastMsg = privateConvs[targetUser] && privateConvs[targetUser][0];
  const nickname = (info && info.nickname) || (lastMsg && lastMsg.senderNickname) || targetUser;
  currentChat = { type: 'private', target: targetUser };
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('messagesContainer').style.display = 'flex';
  document.getElementById('chatInput').style.display = 'flex';
  document.getElementById('chatHeader').style.display = 'flex';

  const avatar = document.getElementById('chatAvatar');
  avatar.style.display = 'flex';
  avatar.textContent = getInitials(nickname);

  document.getElementById('chatTitle').textContent = nickname;
  updateChatHeaderStatus();

  if (currentTab !== 'chats') switchTab('chats');
  renderSidebarList();
  renderMessages();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

function updateChatHeaderStatus() {
  if (currentChat.type !== 'private') return;
  const info = onlineUsers[currentChat.target];
  const isOnline = !!info;
  const userObj = onlineUsers[currentChat.target];
  const nickname = userObj ? userObj.nickname : currentChat.target;
  document.getElementById('chatSubtitle').textContent = isOnline ? '在线' : '离线';
  document.getElementById('chatSubtitle').style.color = isOnline ? 'var(--success)' : 'var(--text-muted)';
}

function renderMessages() {
  const container = document.getElementById('messagesContainer');
  container.innerHTML = '';

  let messages;
  if (currentChat.type === 'public') {
    messages = publicMessages;
  } else if (currentChat.type === 'private') {
    messages = privateConvs[currentChat.target] || [];
  } else {
    return;
  }

  if (messages.length === 0 && currentChat.type === 'public') {
    const sysMsg = document.createElement('div');
    sysMsg.className = 'message system';
    sysMsg.innerHTML = `<div class="message-bubble">还没有消息，发送第一条消息开始聊天吧！</div>`;
    container.appendChild(sysMsg);
    return;
  }

  for (const msg of messages) {
    const msgEl = document.createElement('div');
    const isSelf = msg.sender === currentUser.username;
    msgEl.className = 'message' + (isSelf ? ' self' : '') + (msg.system ? ' system' : '');

    if (msg.system) {
      msgEl.innerHTML = `<div class="message-bubble">${escapeHtml(msg.text)}</div>`;
    } else {
      const info = onlineUsers[msg.sender];
      const senderNickname = (info && info.nickname) || msg.senderNickname || msg.sender;
      msgEl.innerHTML = `
        <div class="avatar">${getInitials(senderNickname)}</div>
        <div class="message-content">
          <div class="message-meta">
            <span class="sender">${escapeHtml(isSelf ? '我' : senderNickname)}</span>
            <span>${formatTime(msg.ts)}</span>
          </div>
          <div class="message-bubble">${escapeHtml(msg.text)}</div>
        </div>
      `;
    }
    container.appendChild(msgEl);
  }

  requestAnimationFrame(() => {
    container.scrollTop = container.scrollHeight;
  });
}

// ============ 登出 ============
function confirmLogout() {
  document.getElementById('logoutModal').classList.add('show');
}
function closeLogoutModal() {
  document.getElementById('logoutModal').classList.remove('show');
}
function logout() {
  if (currentUser && gun) {
    // 标记下线
    gun.get('chathub').get('presence').get(currentUser.username).put({
      username: currentUser.username,
      nickname: currentUser.nickname,
      lastSeen: Date.now(),
      online: false,
    });
  }
  localStorage.removeItem('chathub_session');
  currentUser = null;
  currentChat = { type: null, target: null };
  onlineUsers = {};
  publicMessages = [];
  privateConvs = {};
  renderedPublicIds.clear();
  renderedPrivateIds.clear();
  if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
  if (presenceCleanupInterval) { clearInterval(presenceCleanupInterval); presenceCleanupInterval = null; }
  closeLogoutModal();
  document.getElementById('chatApp').classList.remove('show');
  document.getElementById('loginForm').reset();
  document.getElementById('loginPage').style.display = 'flex';
}

// ============ 自动恢复会话 ============
function restoreSession() {
  const raw = localStorage.getItem('chathub_session');
  if (!raw) return;
  try {
    const sess = JSON.parse(raw);
    if (!sess.username) { localStorage.removeItem('chathub_session'); return; }
    initGun();
    currentUser = {
      username: sess.username,
      nickname: sess.nickname,
      pub: sess.pub,
      epub: sess.epub,
    };
    announcePresence(true);
    enterChatApp();
    startListening();
    startHeartbeat();
  } catch {
    localStorage.removeItem('chathub_session');
  }
}

// ============ 辅助函数 ============
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}

// ============ 事件绑定 ============
document.getElementById('registerForm').addEventListener('submit', handleRegister);
document.getElementById('loginForm').addEventListener('submit', handleLogin);

const messageInput = document.getElementById('messageInput');
messageInput.addEventListener('input', () => autoResize(messageInput));
messageInput.addEventListener('input', handleTyping);
messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

window.addEventListener('beforeunload', () => {
  if (currentUser && gun) {
    gun.get('chathub').get('presence').get(currentUser.username).put({
      username: currentUser.username,
      nickname: currentUser.nickname,
      lastSeen: Date.now(),
      online: false,
    });
  }
});

// 启动
restoreSession();
</script>
