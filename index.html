<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatHub - 网页聊天平台</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #818cf8;
    --bg-main: #0f172a;
    --bg-sidebar: #1e293b;
    --bg-chat: #1e293b;
    --bg-input: #334155;
    --bg-message-self: #6366f1;
    --bg-message-other: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: #334155;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-main);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }
  /* ============ Auth Pages ============ */
  .auth-container {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
    position: relative;
    overflow: hidden;
  }
  .auth-container::before {
    content: "";
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
    border-radius: 50%;
    top: -200px; left: -200px;
    animation: float 8s ease-in-out infinite;
  }
  .auth-container::after {
    content: "";
    position: absolute;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(168,85,247,0.12) 0%, transparent 70%);
    border-radius: 50%;
    bottom: -150px; right: -150px;
    animation: float 10s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-30px) translateX(20px); }
  }
  .auth-card {
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 20px;
    padding: 40px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative;
    z-index: 1;
  }
  .auth-logo {
    text-align: center;
    margin-bottom: 30px;
  }
  .auth-logo .logo-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
    border-radius: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
  }
  .auth-logo h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #818cf8, #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .auth-logo p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 6px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 14px;
    transition: all 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  .form-group input::placeholder {
    color: var(--text-muted);
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .auth-switch {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: var(--text-secondary);
  }
  .auth-switch a {
    color: var(--primary-light);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
  }
  .auth-switch a:hover { text-decoration: underline; }
  .auth-error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .auth-error.show { display: block; }
  .auth-success {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #6ee7b7;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }
  .auth-success.show { display: block; }

  /* ============ Chat Layout ============ */
  .chat-app {
    display: none;
    height: 100vh;
    grid-template-columns: 300px 1fr;
  }
  .chat-app.show { display: grid; }

  /* Sidebar */
  .sidebar {
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 16px;
    flex-shrink: 0;
  }
  .user-info .user-name {
    font-weight: 600;
    font-size: 15px;
  }
  .user-info .user-status {
    font-size: 12px;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .user-status::before {
    content: "";
    width: 7px; height: 7px;
    background: var(--success);
    border-radius: 50%;
    display: inline-block;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: all 0.2s;
    font-size: 18px;
  }
  .icon-btn:hover {
    background: rgba(148, 163, 184, 0.1);
    color: var(--text-primary);
  }
  .sidebar-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-tab {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }
  .sidebar-tab.active {
    color: var(--primary-light);
    border-bottom-color: var(--primary);
  }
  .sidebar-tab:hover:not(.active) {
    background: rgba(148, 163, 184, 0.05);
    color: var(--text-primary);
  }
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .sidebar-list::-webkit-scrollbar { width: 6px; }
  .sidebar-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  .list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }
  .list-item:hover {
    background: rgba(148, 163, 184, 0.08);
  }
  .list-item.active {
    background: rgba(99, 102, 241, 0.15);
  }
  .list-item .item-content {
    flex: 1;
    min-width: 0;
  }
  .list-item .item-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .list-item .item-last {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .list-item .item-time {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .list-item .badge {
    background: var(--primary);
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .online-dot {
    position: relative;
  }
  .online-dot::after {
    content: "";
    position: absolute;
    bottom: 2px; right: 2px;
    width: 10px; height: 10px;
    background: var(--success);
    border: 2px solid var(--bg-sidebar);
    border-radius: 50%;
  }
  .offline-dot::after {
    background: var(--text-muted);
  }
  .empty-list {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 20px;
    font-size: 13px;
  }

  /* Chat Area */
  .chat-area {
    display: flex;
    flex-direction: column;
    background: var(--bg-chat);
    overflow: hidden;
  }
  .chat-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-sidebar);
  }
  .chat-header .chat-title {
    font-weight: 600;
    font-size: 16px;
  }
  .chat-header .chat-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  .message {
    display: flex;
    gap: 10px;
    max-width: 70%;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.self {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .message .avatar {
    width: 32px; height: 32px;
    font-size: 13px;
  }
  .message-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .message.self .message-content { align-items: flex-end; }
  .message-meta {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .message-meta .sender {
    font-weight: 600;
    color: var(--text-secondary);
  }
  .message-bubble {
    background: var(--bg-message-other);
    padding: 10px 14px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
  }
  .message.self .message-bubble {
    background: var(--bg-message-self);
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 4px;
    color: white;
  }
  .message.system .message-bubble {
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
    margin: 0 auto;
    font-style: italic;
  }
  .message.system {
    align-self: center;
    max-width: 100%;
  }
  .message.system .message-meta { display: none; }

  .empty-chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 16px;
  }
  .empty-chat .empty-icon {
    font-size: 64px;
    opacity: 0.4;
  }
  .empty-chat h3 {
    font-size: 18px;
    color: var(--text-secondary);
  }

  /* Input Area */
  .chat-input {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--bg-sidebar);
  }
  .chat-input textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    min-height: 42px;
    transition: border-color 0.2s;
  }
  .chat-input textarea:focus {
    outline: none;
    border-color: var(--primary);
  }
  .send-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border: none;
    color: white;
    width: 42px; height: 42px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-sidebar);
    border-radius: 16px;
    padding: 24px;
    width: 90%;
    max-width: 360px;
    box-shadow: var(--shadow);
  }
  .modal h3 {
    margin-bottom: 16px;
    font-size: 18px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-actions .btn {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .btn-secondary {
    background: var(--bg-input);
    color: var(--text-primary);
  }
  .btn-danger {
    background: var(--danger);
    color: white;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--bg-sidebar);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 10px;
    box-shadow: var(--shadow);
    z-index: 200;
    transform: translateX(400px);
    transition: transform 0.3s ease;
    font-size: 14px;
    max-width: 320px;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .chat-app {
      grid-template-columns: 1fr;
    }
    .sidebar {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 80%;
      max-width: 300px;
      z-index: 10;
      transform: translateX(-100%);
      transition: transform 0.3s;
    }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle { display: block !important; }
    .message { max-width: 85%; }
    .auth-card { padding: 28px 20px; }
  }
  .menu-toggle {
    display: none;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 20px;
    cursor: pointer;
    padding: 6px;
  }
  .backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 5;
  }
  .backdrop.show { display: block; }

  .typing-indicator {
    font-size: 12px;
    color: var(--text-muted);
    padding: 4px 8px;
    font-style: italic;
    display: none;
  }
  .typing-indicator.show { display: block; }
</style>
</head>
<body>

<!-- ============ Auth: Login ============ -->
<div id="loginPage" class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">💬</div>
      <h1>ChatHub</h1>
      <p>欢迎回来，请登录继续聊天</p>
    </div>
    <div id="loginError" class="auth-error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginUsername">用户名</label>
        <input type="text" id="loginUsername" placeholder="请输入用户名" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPassword">密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
    </form>
    <div class="auth-switch">
      还没有账号？ <a onclick="showRegister()">立即注册</a>
    </div>
  </div>
</div>

<!-- ============ Auth: Register ============ -->
<div id="registerPage" class="auth-container" style="display:none;">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">💬</div>
      <h1>创建账号</h1>
      <p>加入 ChatHub，开始聊天</p>
    </div>
    <div id="registerError" class="auth-error"></div>
    <div id="registerSuccess" class="auth-success"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="regUsername">用户名</label>
        <input type="text" id="regUsername" placeholder="3-20位字符，字母/数字/下划线" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="regNickname">昵称</label>
        <input type="text" id="regNickname" placeholder="显示给其他用户的名称" required maxlength="20" autocomplete="nickname">
      </div>
      <div class="form-group">
        <label for="regPassword">密码</label>
        <input type="password" id="regPassword" placeholder="至少6位密码" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="regPasswordConfirm">确认密码</label>
        <input type="password" id="regPasswordConfirm" placeholder="再次输入密码" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="registerBtn">注 册</button>
    </form>
    <div class="auth-switch">
      已有账号？ <a onclick="showLogin()">返回登录</a>
    </div>
  </div>
</div>

<!-- ============ Chat App ============ -->
<div id="chatApp" class="chat-app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="user-info">
        <div class="avatar" id="myAvatar">U</div>
        <div>
          <div class="user-name" id="myNickname">用户</div>
          <div class="user-status">在线</div>
        </div>
      </div>
      <button class="icon-btn" onclick="confirmLogout()" title="退出登录">⏻</button>
    </div>
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="chats" onclick="switchTab('chats')">聊天</button>
      <button class="sidebar-tab" data-tab="users" onclick="switchTab('users')">在线用户</button>
    </div>
    <div class="sidebar-list" id="sidebarList">
      <!-- 动态渲染 -->
    </div>
  </aside>

  <!-- Chat Area -->
  <main class="chat-area">
    <div class="chat-header" id="chatHeader" style="display:none;">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="avatar" id="chatAvatar" style="display:none;">#</div>
      <div style="flex:1;">
        <div class="chat-title" id="chatTitle">选择一个聊天</div>
        <div class="chat-subtitle" id="chatSubtitle"></div>
      </div>
    </div>

    <div id="emptyState" class="empty-chat">
      <div class="empty-icon">💬</div>
      <h3>开始你的第一次聊天</h3>
      <p>从左侧选择一个聊天或在线用户开始对话</p>
    </div>

    <div id="messagesContainer" class="messages" style="display:none;"></div>
    <div id="typingIndicator" class="typing-indicator"></div>

    <div class="chat-input" id="chatInput" style="display:none;">
      <textarea id="messageInput" placeholder="输入消息，按 Enter 发送（Shift+Enter 换行）" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<!-- Logout Modal -->
<div class="modal-overlay" id="logoutModal">
  <div class="modal">
    <h3>退出登录</h3>
    <p style="color: var(--text-secondary); font-size: 14px;">确定要退出登录吗？你的聊天记录将保留在此设备上。</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeLogoutModal()">取消</button>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ====================================================================
 * ChatHub - 完整网页聊天平台
 * 架构：纯前端 + localStorage + BroadcastChannel
 * 支持：注册/登录、公共聊天室、私聊、在线用户、实时消息
 * ==================================================================== */

const STORAGE_KEYS = {
  USERS: 'chathub_users',
  SESSION: 'chathub_session',
  MESSAGES_PUBLIC: 'chathub_messages_public',
  MESSAGES_PRIVATE: 'chathub_messages_private',
  ONLINE_USERS: 'chathub_online_users',
};

// ============ 工具函数 ============
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function getInitials(name) {
  if (!name) return '?';
  return name.charAt(0).toUpperCase();
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (isToday) return time;
  return `${d.getMonth()+1}/${d.getDate()} ${time}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 2800);
}

// ============ 数据访问层 ============
const DB = {
  getUsers() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS) || '{}'); }
    catch { return {}; }
  },
  saveUsers(users) {
    localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
  },
  getUser(username) {
    const users = this.getUsers();
    return users[username.toLowerCase()];
  },
  addUser(user) {
    const users = this.getUsers();
    users[user.username.toLowerCase()] = user;
    this.saveUsers(users);
  },
  setSession(username) {
    localStorage.setItem(STORAGE_KEYS.SESSION, username);
  },
  getSession() {
    return localStorage.getItem(STORAGE_KEYS.SESSION);
  },
  clearSession() {
    localStorage.removeItem(STORAGE_KEYS.SESSION);
  },
  getPublicMessages() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.MESSAGES_PUBLIC) || '[]'); }
    catch { return []; }
  },
  savePublicMessages(msgs) {
    // 只保留最近200条
    if (msgs.length > 200) msgs = msgs.slice(-200);
    localStorage.setItem(STORAGE_KEYS.MESSAGES_PUBLIC, JSON.stringify(msgs));
  },
  getPrivateMessages() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.MESSAGES_PRIVATE) || '{}'); }
    catch { return {}; }
  },
  savePrivateMessages(data) {
    localStorage.setItem(STORAGE_KEYS.MESSAGES_PRIVATE, JSON.stringify(data));
  },
  getPrivateConversation(userA, userB) {
    const key = [userA, userB].sort().join('|');
    const all = this.getPrivateMessages();
    return all[key] || [];
  },
  addPrivateMessage(userA, userB, msg) {
    const key = [userA, userB].sort().join('|');
    const all = this.getPrivateMessages();
    if (!all[key]) all[key] = [];
    all[key].push(msg);
    if (all[key].length > 200) all[key] = all[key].slice(-200);
    this.savePrivateMessages(all);
  },
  getOnlineUsers() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEYS.ONLINE_USERS) || '{}'); }
    catch { return {}; }
  },
  setOnlineUser(username, nickname) {
    const users = this.getOnlineUsers();
    users[username] = { nickname, lastSeen: Date.now() };
    localStorage.setItem(STORAGE_KEYS.ONLINE_USERS, JSON.stringify(users));
    bc && bc.postMessage({ type: 'presence', user: username, nickname, online: true });
  },
  removeOnlineUser(username) {
    const users = this.getOnlineUsers();
    delete users[username];
    localStorage.setItem(STORAGE_KEYS.ONLINE_USERS, JSON.stringify(users));
    bc && bc.postMessage({ type: 'presence', user: username, online: false });
  },
  heartbeat() {
    if (!currentUser) return;
    this.setOnlineUser(currentUser.username, currentUser.nickname);
  },
  cleanupStaleUsers() {
    const users = this.getOnlineUsers();
    const now = Date.now();
    const cleaned = {};
    let changed = false;
    for (const [u, info] of Object.entries(users)) {
      if (now - info.lastSeen < 30000) { // 30秒超时
        cleaned[u] = info;
      } else { changed = true; }
    }
    if (changed) {
      localStorage.setItem(STORAGE_KEYS.ONLINE_USERS, JSON.stringify(cleaned));
    }
  },
};

// ============ 跨标签页通信 ============
let bc = null;
let currentUser = null;
let currentChat = { type: null, target: null }; // type: 'public' | 'private'
let currentTab = 'chats';
let typingTimeout = null;
let heartbeatInterval = null;

function initBroadcastChannel() {
  if (bc) bc.close();
  bc = new BroadcastChannel('chathub');
  bc.onmessage = (e) => {
    const msg = e.data;
    if (!msg) return;
    if (msg.type === 'chat' && msg.message) {
      // 收到新消息
      if (msg.message.recipient) {
        // 私聊消息
        const otherUser = msg.message.sender === currentUser.username ? msg.message.recipient : msg.message.sender;
        DB.addPrivateMessage(msg.message.sender, msg.message.recipient, msg.message);
        if (currentChat.type === 'private' && currentChat.target === otherUser) {
          renderMessages();
        } else {
          showToast(`${msg.message.senderNickname} 给你发了一条私信`);
        }
      } else {
        // 公共消息
        const msgs = DB.getPublicMessages();
        msgs.push(msg.message);
        DB.savePublicMessages(msgs);
        if (currentChat.type === 'public') {
          renderMessages();
        } else {
          showToast(`${msg.message.senderNickname}: ${msg.message.text.substring(0, 30)}`);
        }
      }
    } else if (msg.type === 'presence') {
      // 在线状态变化
      DB.cleanupStaleUsers();
      if (currentTab === 'users') renderSidebarList();
      updateChatHeaderStatus();
    } else if (msg.type === 'typing') {
      // 正在输入提示
      if (currentChat.type === 'private' && currentChat.target === msg.user) {
        const ind = document.getElementById('typingIndicator');
        if (msg.typing) {
          ind.textContent = `${msg.nickname} 正在输入...`;
          ind.classList.add('show');
        } else {
          ind.classList.remove('show');
        }
      }
    } else if (msg.type === 'user_registered') {
      // 新用户注册
      if (currentTab === 'users') renderSidebarList();
    }
  };
}

// ============ 认证系统 ============
function showRegister() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('registerPage').style.display = 'flex';
  document.getElementById('registerError').classList.remove('show');
  document.getElementById('registerSuccess').classList.remove('show');
}

function showLogin() {
  document.getElementById('registerPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginError').classList.remove('show');
}

function showAuthError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.classList.add('show');
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.textContent = '注册中...';

  const username = document.getElementById('regUsername').value.trim();
  const nickname = document.getElementById('regNickname').value.trim();
  const password = document.getElementById('regPassword').value;
  const passwordConfirm = document.getElementById('regPasswordConfirm').value;

  document.getElementById('registerError').classList.remove('show');
  document.getElementById('registerSuccess').classList.remove('show');

  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
    showAuthError('registerError', '用户名需为3-20位字母、数字或下划线');
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }
  if (!nickname) {
    showAuthError('registerError', '请输入昵称');
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }
  if (password.length < 6) {
    showAuthError('registerError', '密码至少6位');
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }
  if (password !== passwordConfirm) {
    showAuthError('registerError', '两次输入的密码不一致');
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }
  if (DB.getUser(username)) {
    showAuthError('registerError', '该用户名已被注册');
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }

  const passwordHash = await sha256(password);
  const user = {
    username,
    nickname,
    passwordHash,
    createdAt: Date.now(),
  };
  DB.addUser(user);

  const successEl = document.getElementById('registerSuccess');
  successEl.textContent = `注册成功！欢迎，${nickname}。正在跳转登录...`;
  successEl.classList.add('show');

  // 广播新用户注册
  if (bc) bc.postMessage({ type: 'user_registered', username, nickname });

  setTimeout(() => {
    document.getElementById('registerForm').reset();
    // 自动填充用户名方便登录
    document.getElementById('loginUsername').value = username;
    showLogin();
    btn.disabled = false;
    btn.textContent = '注 册';
  }, 1500);
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';

  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  document.getElementById('loginError').classList.remove('show');

  const user = DB.getUser(username);
  if (!user) {
    showAuthError('loginError', '用户名不存在，请先注册');
    btn.disabled = false; btn.textContent = '登 录';
    return;
  }
  const passwordHash = await sha256(password);
  if (user.passwordHash !== passwordHash) {
    showAuthError('loginError', '密码错误');
    btn.disabled = false; btn.textContent = '登 录';
    return;
  }

  // 登录成功
  currentUser = { username: user.username, nickname: user.nickname };
  DB.setSession(user.username);
  initBroadcastChannel();
  DB.setOnlineUser(user.username, user.nickname);

  enterChatApp();
  btn.disabled = false;
  btn.textContent = '登 录';
}

function enterChatApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('registerPage').style.display = 'none';
  document.getElementById('chatApp').classList.add('show');

  document.getElementById('myNickname').textContent = currentUser.nickname;
  document.getElementById('myAvatar').textContent = getInitials(currentUser.nickname);

  renderSidebarList();
  openPublicChat();

  // 启动心跳
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(() => {
    DB.heartbeat();
    DB.cleanupStaleUsers();
    if (currentTab === 'users') renderSidebarList();
    updateChatHeaderStatus();
  }, 15000);
}

function confirmLogout() {
  document.getElementById('logoutModal').classList.add('show');
}

function closeLogoutModal() {
  document.getElementById('logoutModal').classList.remove('show');
}

function logout() {
  DB.removeOnlineUser(currentUser.username);
  DB.clearSession();
  currentUser = null;
  currentChat = { type: null, target: null };
  if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
  if (bc) { bc.close(); bc = null; }
  closeLogoutModal();
  document.getElementById('chatApp').classList.remove('show');
  document.getElementById('loginForm').reset();
  document.getElementById('loginPage').style.display = 'flex';
}

// 自动恢复会话
function restoreSession() {
  const username = DB.getSession();
  if (!username) return;
  const user = DB.getUser(username);
  if (!user) { DB.clearSession(); return; }
  currentUser = { username: user.username, nickname: user.nickname };
  initBroadcastChannel();
  DB.setOnlineUser(user.username, user.nickname);
  enterChatApp();
}

// ============ 聊天系统 ============
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  renderSidebarList();
}

function renderSidebarList() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';

  if (currentTab === 'chats') {
    // 公共聊天室
    const publicItem = document.createElement('div');
    publicItem.className = 'list-item' + (currentChat.type === 'public' ? ' active' : '');
    publicItem.onclick = () => openPublicChat();
    const pubMsgs = DB.getPublicMessages();
    const lastMsg = pubMsgs[pubMsgs.length - 1];
    publicItem.innerHTML = `
      <div class="avatar" style="background: linear-gradient(135deg, #10b981, #059669);">#</div>
      <div class="item-content">
        <div class="item-name">公共聊天室</div>
        <div class="item-last">${lastMsg ? escapeHtml(lastMsg.text.substring(0, 30)) : '欢迎大家来聊天'}</div>
      </div>
      <div class="item-time">${lastMsg ? formatTime(lastMsg.ts).split(' ')[0] : ''}</div>
    `;
    list.appendChild(publicItem);

    // 私聊会话列表（基于已有消息的用户）
    const privateMsgs = DB.getPrivateMessages();
    const privateUsers = new Set();
    for (const key of Object.keys(privateMsgs)) {
      const [a, b] = key.split('|');
      if (a === currentUser.username) privateUsers.add(b);
      else if (b === currentUser.username) privateUsers.add(a);
    }

    if (privateUsers.size === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-list';
      empty.textContent = '还没有私聊，点击「在线用户」开始私聊';
      list.appendChild(empty);
    } else {
      for (const otherUser of privateUsers) {
        const userObj = DB.getUser(otherUser);
        const nickname = userObj ? userObj.nickname : otherUser;
        const msgs = DB.getPrivateConversation(currentUser.username, otherUser);
        const lastPriv = msgs[msgs.length - 1];
        const isActive = currentChat.type === 'private' && currentChat.target === otherUser;
        const item = document.createElement('div');
        item.className = 'list-item' + (isActive ? ' active' : '');
        item.onclick = () => openPrivateChat(otherUser);
        item.innerHTML = `
          <div class="avatar">${getInitials(nickname)}</div>
          <div class="item-content">
            <div class="item-name">${escapeHtml(nickname)}</div>
            <div class="item-last">${lastPriv ? escapeHtml((lastPriv.sender === currentUser.username ? '我: ' : '') + lastPriv.text.substring(0, 25)) : ''}</div>
          </div>
          <div class="item-time">${lastPriv ? formatTime(lastPriv.ts).split(' ')[0] : ''}</div>
        `;
        list.appendChild(item);
      }
    }
  } else if (currentTab === 'users') {
    // 在线用户列表
    DB.cleanupStaleUsers();
    const online = DB.getOnlineUsers();
    const others = Object.entries(online).filter(([u]) => u !== currentUser.username);

    if (others.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-list';
      empty.textContent = '当前没有其他在线用户，邀请朋友注册吧！';
      list.appendChild(empty);
      return;
    }

    for (const [username, info] of others) {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.onclick = () => openPrivateChat(username);
      item.innerHTML = `
        <div class="avatar online-dot">${getInitials(info.nickname)}</div>
        <div class="item-content">
          <div class="item-name">${escapeHtml(info.nickname)}</div>
          <div class="item-last" style="color: var(--success);">在线</div>
        </div>
      `;
      list.appendChild(item);
    }
  }
}

function openPublicChat() {
  currentChat = { type: 'public', target: null };
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('messagesContainer').style.display = 'flex';
  document.getElementById('chatInput').style.display = 'flex';
  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('chatAvatar').style.display = 'none';

  document.getElementById('chatTitle').textContent = '公共聊天室';
  const online = DB.getOnlineUsers();
  const count = Object.keys(online).length;
  document.getElementById('chatSubtitle').textContent = `${count} 人在线`;

  renderSidebarList();
  renderMessages();
  // 移动端关闭侧栏
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

function openPrivateChat(targetUser) {
  const userObj = DB.getUser(targetUser);
  const nickname = userObj ? userObj.nickname : targetUser;
  currentChat = { type: 'private', target: targetUser };
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('messagesContainer').style.display = 'flex';
  document.getElementById('chatInput').style.display = 'flex';
  document.getElementById('chatHeader').style.display = 'flex';

  const avatar = document.getElementById('chatAvatar');
  avatar.style.display = 'flex';
  avatar.textContent = getInitials(nickname);

  document.getElementById('chatTitle').textContent = nickname;
  updateChatHeaderStatus();

  if (currentTab !== 'chats') switchTab('chats');
  renderSidebarList();
  renderMessages();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

function updateChatHeaderStatus() {
  if (currentChat.type !== 'private') return;
  const online = DB.getOnlineUsers();
  const isOnline = !!online[currentChat.target];
  const userObj = DB.getUser(currentChat.target);
  const nickname = userObj ? userObj.nickname : currentChat.target;
  document.getElementById('chatSubtitle').textContent = isOnline ? '在线' : '离线';
  document.getElementById('chatSubtitle').style.color = isOnline ? 'var(--success)' : 'var(--text-muted)';
}

function renderMessages() {
  const container = document.getElementById('messagesContainer');
  container.innerHTML = '';

  let messages;
  if (currentChat.type === 'public') {
    messages = DB.getPublicMessages();
  } else if (currentChat.type === 'private') {
    messages = DB.getPrivateConversation(currentUser.username, currentChat.target);
  } else {
    return;
  }

  if (messages.length === 0 && currentChat.type === 'public') {
    const sysMsg = document.createElement('div');
    sysMsg.className = 'message system';
    sysMsg.innerHTML = `<div class="message-bubble">还没有消息，发送第一条消息开始聊天吧！</div>`;
    container.appendChild(sysMsg);
    return;
  }

  for (const msg of messages) {
    const msgEl = document.createElement('div');
    const isSelf = msg.sender === currentUser.username;
    msgEl.className = 'message' + (isSelf ? ' self' : '') + (msg.system ? ' system' : '');

    if (msg.system) {
      msgEl.innerHTML = `<div class="message-bubble">${escapeHtml(msg.text)}</div>`;
    } else {
      const senderUser = DB.getUser(msg.sender);
      const senderNickname = senderUser ? senderUser.nickname : msg.senderNickname || msg.sender;
      msgEl.innerHTML = `
        <div class="avatar">${getInitials(senderNickname)}</div>
        <div class="message-content">
          <div class="message-meta">
            <span class="sender">${escapeHtml(isSelf ? '我' : senderNickname)}</span>
            <span>${formatTime(msg.ts)}</span>
          </div>
          <div class="message-bubble">${escapeHtml(msg.text)}</div>
        </div>
      `;
    }
    container.appendChild(msgEl);
  }

  // 滚到底部
  requestAnimationFrame(() => {
    container.scrollTop = container.scrollHeight;
  });
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text) return;

  const message = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    sender: currentUser.username,
    senderNickname: currentUser.nickname,
    text,
    ts: Date.now(),
  };

  if (currentChat.type === 'public') {
    const msgs = DB.getPublicMessages();
    msgs.push(message);
    DB.savePublicMessages(msgs);
    // 广播给其他标签页
    bc.postMessage({ type: 'chat', message });
  } else if (currentChat.type === 'private') {
    message.recipient = currentChat.target;
    DB.addPrivateMessage(currentUser.username, currentChat.target, message);
    bc.postMessage({ type: 'chat', message });
  }

  input.value = '';
  autoResize(input);
  renderMessages();
  renderSidebarList();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleTyping() {
  if (currentChat.type !== 'private') return;
  if (!bc) return;

  if (typingTimeout) clearTimeout(typingTimeout);
  bc.postMessage({
    type: 'typing',
    user: currentUser.username,
    nickname: currentUser.nickname,
    typing: true,
  });
  typingTimeout = setTimeout(() => {
    bc.postMessage({
      type: 'typing',
      user: currentUser.username,
      nickname: currentUser.nickname,
      typing: false,
    });
  }, 2000);
}

// ============ 移动端 ============
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}

// ============ 事件绑定 ============
document.getElementById('registerForm').addEventListener('submit', handleRegister);
document.getElementById('loginForm').addEventListener('submit', handleLogin);

const messageInput = document.getElementById('messageInput');
messageInput.addEventListener('input', () => autoResize(messageInput));
messageInput.addEventListener('input', handleTyping);
messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// 页面卸载时清除在线状态
window.addEventListener('beforeunload', () => {
  if (currentUser && bc) {
    DB.removeOnlineUser(currentUser.username);
  }
});

// 定期清理过期用户（标签页关闭未清理的情况）
setInterval(() => {
  DB.cleanupStaleUsers();
}, 30000);

// 启动时恢复会话
restoreSession();
</script>
</body>
</html>
