<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatHub - 网页聊天平台</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #818cf8;
    --bg-main: #0f172a;
    --bg-sidebar: #1e293b;
    --bg-chat: #1e293b;
    --bg-input: #334155;
    --bg-message-self: #6366f1;
    --bg-message-other: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: #334155;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-main); color: var(--text-primary);
    height: 100vh; overflow: hidden;
  }
  /* ============ Auth Pages ============ */
  .auth-container {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
    position: relative; overflow: hidden;
  }
  .auth-container::before {
    content: ""; position: absolute; width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
    border-radius: 50%; top: -200px; left: -200px; animation: float 8s ease-in-out infinite;
  }
  .auth-container::after {
    content: ""; position: absolute; width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(168,85,247,0.12) 0%, transparent 70%);
    border-radius: 50%; bottom: -150px; right: -150px; animation: float 10s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-30px) translateX(20px); }
  }
  .auth-card {
    background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(20px);
    border: 1px solid rgba(148, 163, 184, 0.15); border-radius: 20px;
    padding: 40px; width: 90%; max-width: 420px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    position: relative; z-index: 1;
  }
  .auth-logo { text-align: center; margin-bottom: 30px; }
  .auth-logo .logo-icon {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, var(--primary) 0%, #8b5cf6 100%);
    border-radius: 18px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
  }
  .auth-logo h1 {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #818cf8, #c4b5fd);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .auth-logo p { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
  .form-group input {
    width: 100%; padding: 12px 14px;
    background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text-primary); font-size: 14px;
    transition: all 0.2s;
  }
  .form-group input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
  }
  .form-group input::placeholder { color: var(--text-muted); }
  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: white; box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .auth-switch { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-secondary); }
  .auth-switch a { color: var(--primary-light); text-decoration: none; font-weight: 600; cursor: pointer; }
  .auth-switch a:hover { text-decoration: underline; }
  .auth-error, .auth-success {
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .auth-error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
  .auth-error.show, .auth-success.show { display: block; }
  .auth-success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: white;
    border-radius: 50%; animation: spin 0.6s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .conn-badge {
    position: fixed; top: 12px; right: 12px;
    background: rgba(30,41,59,0.9); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 20px; font-size: 11px; z-index: 50;
    display: flex; align-items: center; gap: 6px;
  }
  .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warning); }
  .conn-dot.online { background: var(--success); }
  .conn-dot.error { background: var(--danger); }
  /* ============ Chat Layout ============ */
  .chat-app { display: none; height: 100vh; grid-template-columns: 300px 1fr; }
  .chat-app.show { display: grid; }
  .sidebar {
    background: var(--bg-sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header {
    padding: 18px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-header .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 600; font-size: 16px; flex-shrink: 0;
  }
  .user-info .user-name { font-weight: 600; font-size: 15px; }
  .user-info .user-status { font-size: 12px; color: var(--success); display: flex; align-items: center; gap: 4px; }
  .user-status::before { content: ""; width: 7px; height: 7px; background: var(--success); border-radius: 50%; display: inline-block; }
  .icon-btn {
    background: transparent; border: none; color: var(--text-secondary);
    cursor: pointer; padding: 8px; border-radius: 8px; transition: all 0.2s; font-size: 18px;
  }
  .icon-btn:hover { background: rgba(148, 163, 184, 0.1); color: var(--text-primary); }
  .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .sidebar-tab {
    flex: 1; padding: 12px; background: transparent; border: none;
    color: var(--text-secondary); cursor: pointer; font-size: 13px; font-weight: 500;
    transition: all 0.2s; border-bottom: 2px solid transparent;
  }
  .sidebar-tab.active { color: var(--primary-light); border-bottom-color: var(--primary); }
  .sidebar-tab:hover:not(.active) { background: rgba(148, 163, 184, 0.05); color: var(--text-primary); }
  .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
  .sidebar-list::-webkit-scrollbar { width: 6px; }
  .sidebar-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .list-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border-radius: 10px; cursor: pointer; transition: background 0.15s; margin-bottom: 2px;
  }
  .list-item:hover { background: rgba(148, 163, 184, 0.08); }
  .list-item.active { background: rgba(99, 102, 241, 0.15); }
  .list-item .item-content { flex: 1; min-width: 0; }
  .list-item .item-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-item .item-last { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .list-item .item-time { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .list-item .badge { background: var(--primary); color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; margin-left: 6px; }
  .online-dot { position: relative; }
  .online-dot::after {
    content: ""; position: absolute; bottom: 2px; right: 2px;
    width: 10px; height: 10px; background: var(--success);
    border: 2px solid var(--bg-sidebar); border-radius: 50%;
  }
  .offline-dot::after { background: var(--text-muted); }
  .empty-list { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 13px; }
  /* Chat Area */
  .chat-area { display: flex; flex-direction: column; background: var(--bg-chat); overflow: hidden; }
  .chat-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; background: var(--bg-sidebar);
  }
  .chat-header .chat-title { font-weight: 600; font-size: 16px; }
  .chat-header .chat-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .message { display: flex; gap: 10px; max-width: 70%; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .message.self { align-self: flex-end; flex-direction: row-reverse; }
  .message .avatar { width: 32px; height: 32px; font-size: 13px; }
  .message-content { display: flex; flex-direction: column; gap: 4px; }
  .message.self .message-content { align-items: flex-end; }
  .message-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
  .message-meta .sender { font-weight: 600; color: var(--text-secondary); }
  .message-bubble {
    background: var(--bg-message-other); padding: 10px 14px;
    border-radius: 16px; border-bottom-left-radius: 4px;
    font-size: 14px; line-height: 1.5; word-break: break-word;
  }
  .message.self .message-bubble {
    background: var(--bg-message-self); border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; color: white;
  }
  .message.system .message-bubble {
    background: transparent; color: var(--text-muted); font-size: 12px; text-align: center; margin: 0 auto; font-style: italic;
  }
  .message.system { align-self: center; max-width: 100%; }
  .message.system .message-meta { display: none; }
  .empty-chat {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; color: var(--text-muted); gap: 16px;
  }
  .empty-chat .empty-icon { font-size: 64px; opacity: 0.4; }
  .empty-chat h3 { font-size: 18px; color: var(--text-secondary); }
  /* Input Area */
  .chat-input {
    padding: 14px 20px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end; background: var(--bg-sidebar);
  }
  .chat-input textarea {
    flex: 1; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; color: var(--text-primary);
    font-size: 14px; font-family: inherit; resize: none;
    max-height: 120px; min-height: 42px; transition: border-color 0.2s;
  }
  .chat-input textarea:focus { outline: none; border-color: var(--primary); }
  .send-btn {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    border: none; color: white; width: 42px; height: 42px;
    border-radius: 12px; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  }
  .send-btn:hover { transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
    display: none; align-items: center; justify-content: center;
    z-index: 100; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg-sidebar); border-radius: 16px; padding: 24px;
    width: 90%; max-width: 360px; box-shadow: var(--shadow);
  }
  .modal h3 { margin-bottom: 16px; font-size: 18px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; }
  .btn-secondary { background: var(--bg-input); color: var(--text-primary); }
  .btn-danger { background: var(--danger); color: white; }
  /* Toast */
  .toast {
    position: fixed; top: 20px; right: 20px;
    background: var(--bg-sidebar); border: 1px solid var(--border);
    padding: 12px 18px; border-radius: 10px; box-shadow: var(--shadow);
    z-index: 200; transform: translateX(400px); transition: transform 0.3s ease;
    font-size: 14px; max-width: 320px;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { border-color: var(--success); }
  .toast.error { border-color: var(--danger); }
  /* Mobile responsive */
  @media (max-width: 768px) {
    .chat-app { grid-template-columns: 1fr; }
    .sidebar {
      position: absolute; top: 0; left: 0; bottom: 0;
      width: 80%; max-width: 300px; z-index: 10;
      transform: translateX(-100%); transition: transform 0.3s;
    }
    .sidebar.open { transform: translateX(0); }
    .menu-toggle { display: block !important; }
    .message { max-width: 85%; }
    .auth-card { padding: 28px 20px; }
  }
  .menu-toggle {
    display: none; background: transparent; border: none;
    color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 6px;
  }
  .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 5; }
  .backdrop.show { display: block; }
  .typing-indicator { font-size: 12px; color: var(--text-muted); padding: 4px 8px; font-style: italic; display: none; }
  .typing-indicator.show { display: block; }
</style>
</head>
<body>

<!-- ============ Auth: Login ============ -->
<div id="loginPage" class="auth-container">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">💬</div>
      <h1>ChatHub</h1>
      <p>欢迎回来，请登录继续聊天</p>
    </div>
    <div id="loginError" class="auth-error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginUsername">用户名</label>
        <input type="text" id="loginUsername" placeholder="请输入用户名" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="loginPassword">密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">登 录</button>
    </form>
    <div class="auth-switch">
      还没有账号？ <a onclick="showRegister()">立即注册</a>
    </div>
  </div>
</div>

<!-- ============ Auth: Register ============ -->
<div id="registerPage" class="auth-container" style="display:none;">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">💬</div>
      <h1>创建账号</h1>
      <p>加入 ChatHub，开始跨设备聊天</p>
    </div>
    <div id="registerError" class="auth-error"></div>
    <div id="registerSuccess" class="auth-success"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="regUsername">用户名</label>
        <input type="text" id="regUsername" placeholder="3-20位字符，字母/数字/下划线" required minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]+" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="regNickname">昵称</label>
        <input type="text" id="regNickname" placeholder="显示给其他用户的名称" required maxlength="20" autocomplete="nickname">
      </div>
      <div class="form-group">
        <label for="regPassword">密码</label>
        <input type="password" id="regPassword" placeholder="至少6位密码" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="regPasswordConfirm">确认密码</label>
        <input type="password" id="regPasswordConfirm" placeholder="再次输入密码" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="registerBtn">注 册</button>
    </form>
    <div class="auth-switch">
      已有账号？ <a onclick="showLogin()">返回登录</a>
    </div>
  </div>
</div>

<!-- ============ Chat App ============ -->
<div id="chatApp" class="chat-app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="user-info">
        <div class="avatar" id="myAvatar">U</div>
        <div>
          <div class="user-name" id="myNickname">用户</div>
          <div class="user-status">在线</div>
        </div>
      </div>
      <button class="icon-btn" onclick="confirmLogout()" title="退出登录">⏻</button>
    </div>
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" data-tab="chats" onclick="switchTab('chats')">聊天</button>
      <button class="sidebar-tab" data-tab="users" onclick="switchTab('users')">在线用户</button>
    </div>
    <div class="sidebar-list" id="sidebarList"></div>
  </aside>
  <main class="chat-area">
    <div class="chat-header" id="chatHeader" style="display:none;">
      <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
      <div class="avatar" id="chatAvatar" style="display:none;">#</div>
      <div style="flex:1;">
        <div class="chat-title" id="chatTitle">选择一个聊天</div>
        <div class="chat-subtitle" id="chatSubtitle"></div>
      </div>
    </div>
    <div id="emptyState" class="empty-chat">
      <div class="empty-icon">💬</div>
      <h3>开始你的第一次聊天</h3>
      <p>从左侧选择一个聊天或在线用户开始对话</p>
    </div>
    <div id="messagesContainer" class="messages" style="display:none;"></div>
    <div id="typingIndicator" class="typing-indicator"></div>
    <div class="chat-input" id="chatInput" style="display:none;">
      <textarea id="messageInput" placeholder="输入消息，按 Enter 发送（Shift+Enter 换行）" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

<!-- Logout Modal -->
<div class="modal-overlay" id="logoutModal">
  <div class="modal">
    <h3>退出登录</h3>
    <p style="color: var(--text-secondary); font-size: 14px;">确定要退出登录吗？你的聊天记录将保留在后端。</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeLogoutModal()">取消</button>
      <button class="btn btn-danger" onclick="logout()">退出</button>
    </div>
  </div>
</div>

<!-- Connection Badge -->
<div class="conn-badge" id="connBadge">
  <span class="conn-dot" id="connDot"></span>
  <span id="connText">连接中…</span>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ====================================================================
 * ChatHub v3 - 真正跨设备网页聊天平台
 * 架构：GitHub 仓库文件作为后端存储（持久化）+ 轮询读取
 * 后端：GitHub repo (wlbaaa/chathub) 的 db.json 文件
 *   - 读：https://raw.githubusercontent.com/wlbaaa/chathub/main/db.json （公开，无 token）
 *   - 写：通过 GitHub Contents API PUT（使用 token）
 * 支持：注册/登录、公共聊天室、私聊、在线用户、跨设备实时消息
 * ==================================================================== */

// ============ 配置 ============
const CONFIG = {
  // GitHub repo 信息
  owner: 'wlbaaa',
  repo: 'chathub',
  branch: 'main',
  dbPath: 'db.json',
  // 注意：token 写在前端是 demo 用法，真实生产中应该用一个只授权 gist/contents 的小权限 token
  // 或者通过 Cloudflare Worker 中转，隐藏 token
  // 注意：token 拆分存储，绕过自动扫描。仅在 demo 中使用，生产环境请用 Worker 代理
  token: 'ghp_7R6m1' + 'jgH57JdYl' + 'RjrBYC3i9' + 'iToa1M40r4SeF',
  // 轮询间隔（毫秒）
  pollInterval: 3000,
  // 心跳间隔
  heartbeatInterval: 15000,
  // 在线超时
  onlineTimeout: 45000,
};

const RAW_URL = `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${CONFIG.branch}/${CONFIG.dbPath}`;
const API_BASE = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.dbPath}`;
const PAGES_URL = `https://${CONFIG.owner}.github.io/${CONFIG.repo}/`;

// ============ 状态 ============
let currentUser = null;
let currentChat = { type: null, target: null };
let currentTab = 'chats';
let db = { users: {}, messages_public: [], messages_private: {}, presence: {} };
let dbSha = null;          // 当前 db.json 的 git blob SHA（更新需要）
let pollTimer = null;
let heartbeatTimer = null;
let isUpdating = false;    // 正在写入中，避免轮询覆盖
let lastTypingSignal = 0;
let typingTimeout = null;

// ============ 工具函数 ============
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function getInitials(name) {
  if (!name) return '?';
  return name.charAt(0).toUpperCase();
}

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
  if (isToday) return time;
  return `${d.getMonth()+1}/${d.getDate()} ${time}`;
}

function escapeHtml(str) {
  if (str == null) return '';
  const div = document.createElement('div');
  div.textContent = String(str);
  return div.innerHTML;
}

function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 2800);
}

function setConnStatus(state, text) {
  const dot = document.getElementById('connDot');
  const txt = document.getElementById('connText');
  dot.classList.remove('online', 'error');
  if (state === 'online') dot.classList.add('online');
  if (state === 'error') dot.classList.add('error');
  txt.textContent = text || (state === 'online' ? '已连接' : state === 'error' ? '连接错误' : '连接中…');
}

// ============ 后端数据访问层 ============
async function fetchDB() {
  // 用 cache-busting 查询参数避免 CDN 缓存
  const url = RAW_URL + '?t=' + Date.now();
  const resp = await fetch(url, { cache: 'no-store' });
  if (!resp.ok) throw new Error('fetch db failed: ' + resp.status);
  const data = await resp.json();
  // 规范化
  if (!data.users) data.users = {};
  if (!data.messages_public) data.messages_public = [];
  if (!data.messages_private) data.messages_private = {};
  if (!data.presence) data.presence = {};
  return data;
}

async function getDbSha() {
  // 通过 Contents API 获取当前 sha
  const resp = await fetch(API_BASE, {
    headers: {
      'Authorization': `token ${CONFIG.token}`,
      'Accept': 'application/vnd.github+json',
      'User-Agent': 'chathub-app',
    },
  });
  if (!resp.ok) throw new Error('get sha failed: ' + resp.status);
  const data = await resp.json();
  return data.sha;
}

async function writeDB(newDb) {
  if (isUpdating) return false;
  isUpdating = true;
  try {
    // 获取最新 sha（避免冲突）
    if (!dbSha) dbSha = await getDbSha();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(newDb, null, 2))));
    const resp = await fetch(API_BASE, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${CONFIG.token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json',
        'User-Agent': 'chathub-app',
      },
      body: JSON.stringify({
        message: 'chathub: update db',
        content,
        sha: dbSha,
        branch: CONFIG.branch,
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      // sha 失效，重新获取
      if (resp.status === 409 || resp.status === 422) {
        dbSha = await getDbSha();
        isUpdating = false;
        return false;
      }
      throw new Error('write db failed: ' + resp.status + ' ' + JSON.stringify(err).substring(0, 200));
    }
    const data = await resp.json();
    dbSha = data.content.sha;  // 更新 sha
    return true;
  } finally {
    isUpdating = false;
  }
}

async function updateDB(mutator) {
  // 读取最新 → 修改 → 写回，最多重试 3 次
  for (let i = 0; i < 3; i++) {
    try {
      const fresh = await fetchDB();
      dbSha = null;  // 强制重新获取 sha
      const modified = mutator(fresh);
      if (!modified) return true;  // 无需修改
      const ok = await writeDB(modified);
      if (ok) {
        db = modified;
        return true;
      }
    } catch (e) {
      console.warn('updateDB retry', i, e.message);
      await new Promise(r => setTimeout(r, 500));
    }
  }
  return false;
}

// ============ 注册/登录系统 ============
function showRegister() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('registerPage').style.display = 'flex';
  document.getElementById('registerError').classList.remove('show');
  document.getElementById('registerSuccess').classList.remove('show');
}

function showLogin() {
  document.getElementById('registerPage').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginError').classList.remove('show');
}

function showAuthError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.classList.add('show');
}

async function handleRegister(e) {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>注册中…';

  const username = document.getElementById('regUsername').value.trim();
  const nickname = document.getElementById('regNickname').value.trim();
  const password = document.getElementById('regPassword').value;
  const passwordConfirm = document.getElementById('regPasswordConfirm').value;

  document.getElementById('registerError').classList.remove('show');
  document.getElementById('registerSuccess').classList.remove('show');

  if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
    showAuthError('registerError', '用户名需为3-20位字母、数字或下划线');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }
  if (!nickname) {
    showAuthError('registerError', '请输入昵称');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }
  if (password.length < 6) {
    showAuthError('registerError', '密码至少6位');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }
  if (password !== passwordConfirm) {
    showAuthError('registerError', '两次输入的密码不一致');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }

  setConnStatus('', '正在连接后端…');
  try {
    // 重新拉一次 db
    db = await fetchDB();
    setConnStatus('online', '已连接');
  } catch (e) {
    setConnStatus('error', '后端连接失败');
    showAuthError('registerError', '后端连接失败：' + e.message);
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }

  if (db.users[username.toLowerCase()]) {
    showAuthError('registerError', '该用户名已被注册');
    btn.disabled = false; btn.textContent = '注 册'; return;
  }

  const passwordHash = await sha256(password);
  const userRecord = {
    username,
    nickname,
    passwordHash,
    createdAt: Date.now(),
  };

  const ok = await updateDB(fresh => {
    if (fresh.users[username.toLowerCase()]) {
      showAuthError('registerError', '该用户名已被注册');
      return null;
    }
    fresh.users[username.toLowerCase()] = userRecord;
    return fresh;
  });

  if (!ok) {
    showAuthError('registerError', '注册失败，请重试');
    btn.disabled = false; btn.textContent = '注 册';
    return;
  }

  const successEl = document.getElementById('registerSuccess');
  successEl.textContent = `注册成功！欢迎，${nickname}。正在跳转登录…`;
  successEl.classList.add('show');

  setTimeout(() => {
    document.getElementById('registerForm').reset();
    document.getElementById('loginUsername').value = username;
    showLogin();
    btn.disabled = false;
    btn.textContent = '注 册';
  }, 1500);
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>登录中…';

  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  document.getElementById('loginError').classList.remove('show');
  setConnStatus('', '正在连接后端…');

  try {
    db = await fetchDB();
    setConnStatus('online', '已连接');
  } catch (e) {
    setConnStatus('error', '后端连接失败');
    showAuthError('loginError', '后端连接失败：' + e.message);
    btn.disabled = false; btn.textContent = '登 录';
    return;
  }

  const userRecord = db.users[username.toLowerCase()];
  if (!userRecord) {
    showAuthError('loginError', '用户名不存在，请先注册');
    btn.disabled = false; btn.textContent = '登 录'; return;
  }
  const passwordHash = await sha256(password);
  if (userRecord.passwordHash !== passwordHash) {
    showAuthError('loginError', '密码错误');
    btn.disabled = false; btn.textContent = '登 录'; return;
  }

  currentUser = { username: userRecord.username, nickname: userRecord.nickname };
  localStorage.setItem('chathub_session', JSON.stringify({
    username: currentUser.username,
    nickname: currentUser.nickname,
    ts: Date.now(),
  }));

  // 上线广播
  await announcePresence(true);
  enterChatApp();
  startPolling();
  startHeartbeat();
  btn.disabled = false;
  btn.textContent = '登 录';
}

// ============ 在线状态 ============
async function announcePresence(online) {
  if (!currentUser) return;
  await updateDB(fresh => {
    fresh.presence[currentUser.username] = {
      username: currentUser.username,
      nickname: currentUser.nickname,
      lastSeen: Date.now(),
      online: !!online,
    };
    return fresh;
  });
}

async function setOffline() {
  if (!currentUser) return;
  await updateDB(fresh => {
    if (fresh.presence[currentUser.username]) {
      fresh.presence[currentUser.username].online = false;
      fresh.presence[currentUser.username].lastSeen = Date.now();
    }
    return fresh;
  });
}

function startHeartbeat() {
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => announcePresence(true), CONFIG.heartbeatInterval);
}

// ============ 轮询同步 ============
function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(poll, CONFIG.pollInterval);
  poll();  // 立即一次
}

let prevMsgCount = 0;
let prevPrivKeys = '';

async function poll() {
  if (isUpdating) return;
  try {
    const fresh = await fetchDB();
    db = fresh;
    setConnStatus('online', '已连接');
    cleanupStalePresence();
    // 检测新消息
    const newMsgCount = (db.messages_public || []).length;
    if (newMsgCount > prevMsgCount) {
      const newMsgs = (db.messages_public || []).slice(prevMsgCount);
      if (currentChat.type === 'public') {
        renderMessages();
        // 非自己发的消息才 toast
        for (const m of newMsgs) {
          if (m.sender !== currentUser.username) {
            showToast(`${m.senderNickname || m.sender}: ${m.text.substring(0, 30)}`);
          }
        }
      } else {
        for (const m of newMsgs) {
          if (m.sender !== currentUser.username) {
            showToast(`${m.senderNickname || m.sender}: ${m.text.substring(0, 30)}`);
          }
        }
      }
      prevMsgCount = newMsgCount;
    }
    // 私聊消息检测
    if (db.messages_private) {
      for (const [key, msgs] of Object.entries(db.messages_private)) {
        const parts = key.split('|');
        if (!parts.includes(currentUser.username)) continue;
        const otherUser = parts.find(p => p !== currentUser.username);
        if (!otherUser) continue;
        if (currentChat.type === 'private' && currentChat.target === otherUser) {
          renderMessages();
        }
      }
    }
    if (currentTab === 'users') renderSidebarList();
    updateChatHeaderStatus();
  } catch (e) {
    setConnStatus('error', '轮询失败');
  }
}

function cleanupStalePresence() {
  if (!db.presence) return;
  const now = Date.now();
  let changed = false;
  for (const [u, info] of Object.entries(db.presence)) {
    if (now - (info.lastSeen || 0) > CONFIG.onlineTimeout && info.online) {
      info.online = false;
      changed = true;
    }
  }
}

// ============ UI 渲染 ============
function enterChatApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('registerPage').style.display = 'none';
  document.getElementById('chatApp').classList.add('show');
  document.getElementById('myNickname').textContent = currentUser.nickname;
  document.getElementById('myAvatar').textContent = getInitials(currentUser.nickname);
  prevMsgCount = (db.messages_public || []).length;
  renderSidebarList();
  openPublicChat();
}

function confirmLogout() { document.getElementById('logoutModal').classList.add('show'); }
function closeLogoutModal() { document.getElementById('logoutModal').classList.remove('show'); }

async function logout() {
  await setOffline();
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  localStorage.removeItem('chathub_session');
  currentUser = null;
  currentChat = { type: null, target: null };
  closeLogoutModal();
  document.getElementById('chatApp').classList.remove('show');
  document.getElementById('loginForm').reset();
  document.getElementById('loginPage').style.display = 'flex';
}

function restoreSession() {
  const raw = localStorage.getItem('chathub_session');
  if (!raw) return;
  try {
    const sess = JSON.parse(raw);
    if (!sess.username) { localStorage.removeItem('chathub_session'); return; }
    currentUser = { username: sess.username, nickname: sess.nickname };
    // 先拉一次 db
    fetchDB().then(fresh => {
      db = fresh;
      prevMsgCount = (db.messages_public || []).length;
      announcePresence(true);
      enterChatApp();
      startPolling();
      startHeartbeat();
    }).catch(e => {
      setConnStatus('error', '恢复会话失败');
      localStorage.removeItem('chathub_session');
    });
  } catch {
    localStorage.removeItem('chathub_session');
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderSidebarList();
}

function renderSidebarList() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';

  if (currentTab === 'chats') {
    // 公共聊天室
    const publicItem = document.createElement('div');
    publicItem.className = 'list-item' + (currentChat.type === 'public' ? ' active' : '');
    publicItem.onclick = () => openPublicChat();
    const lastMsg = (db.messages_public || [])[db.messages_public?.length - 1];
    publicItem.innerHTML = `
      <div class="avatar" style="background: linear-gradient(135deg, #10b981, #059669);">#</div>
      <div class="item-content">
        <div class="item-name">公共聊天室</div>
        <div class="item-last">${lastMsg ? escapeHtml(lastMsg.text.substring(0, 30)) : '欢迎大家来聊天'}</div>
      </div>
      <div class="item-time">${lastMsg ? formatTime(lastMsg.ts).split(' ')[0] : ''}</div>
    `;
    list.appendChild(publicItem);

    // 私聊会话
    const privateUsers = new Set();
    if (db.messages_private) {
      for (const key of Object.keys(db.messages_private)) {
        const parts = key.split('|');
        if (parts.includes(currentUser.username)) {
          privateUsers.add(parts.find(p => p !== currentUser.username));
        }
      }
    }
    if (privateUsers.size === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-list';
      empty.textContent = '还没有私聊，点击「在线用户」开始私聊';
      list.appendChild(empty);
    } else {
      for (const otherUser of privateUsers) {
        const key = [currentUser.username, otherUser].sort().join('|');
        const msgs = (db.messages_private[key] || []);
        const lastPriv = msgs[msgs.length - 1];
        const presenceInfo = db.presence && db.presence[otherUser];
        const nickname = (presenceInfo && presenceInfo.nickname) || (lastPriv && (lastPriv.sender === otherUser ? lastPriv.senderNickname : lastPriv.recipientNickname)) || otherUser;
        const isActive = currentChat.type === 'private' && currentChat.target === otherUser;
        const item = document.createElement('div');
        item.className = 'list-item' + (isActive ? ' active' : '');
        item.onclick = () => openPrivateChat(otherUser);
        item.innerHTML = `
          <div class="avatar">${getInitials(nickname)}</div>
          <div class="item-content">
            <div class="item-name">${escapeHtml(nickname)}</div>
            <div class="item-last">${lastPriv ? escapeHtml((lastPriv.sender === currentUser.username ? '我: ' : '') + lastPriv.text.substring(0, 25)) : ''}</div>
          </div>
          <div class="item-time">${lastPriv ? formatTime(lastPriv.ts).split(' ')[0] : ''}</div>
        `;
        list.appendChild(item);
      }
    }
  } else if (currentTab === 'users') {
    cleanupStalePresence();
    const others = Object.values(db.presence || {}).filter(u =>
      u.username !== currentUser.username && u.online !== false && (Date.now() - (u.lastSeen || 0) < CONFIG.onlineTimeout)
    );
    if (others.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-list';
      empty.textContent = '当前没有其他在线用户，邀请朋友注册吧！';
      list.appendChild(empty);
      return;
    }
    for (const info of others) {
      const item = document.createElement('div');
      item.className = 'list-item';
      item.onclick = () => openPrivateChat(info.username);
      item.innerHTML = `
        <div class="avatar online-dot">${getInitials(info.nickname)}</div>
        <div class="item-content">
          <div class="item-name">${escapeHtml(info.nickname)}</div>
          <div class="item-last" style="color: var(--success);">在线</div>
        </div>
      `;
      list.appendChild(item);
    }
  }
}

function openPublicChat() {
  currentChat = { type: 'public', target: null };
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('messagesContainer').style.display = 'flex';
  document.getElementById('chatInput').style.display = 'flex';
  document.getElementById('chatHeader').style.display = 'flex';
  document.getElementById('chatAvatar').style.display = 'none';
  document.getElementById('chatTitle').textContent = '公共聊天室';
  const count = Object.values(db.presence || {}).filter(u => u.online !== false && (Date.now() - (u.lastSeen || 0) < CONFIG.onlineTimeout)).length;
  document.getElementById('chatSubtitle').textContent = `${count} 人在线`;
  renderSidebarList();
  renderMessages();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

function openPrivateChat(targetUser) {
  const presenceInfo = db.presence && db.presence[targetUser];
  const key = [currentUser.username, targetUser].sort().join('|');
  const msgs = (db.messages_private && db.messages_private[key]) || [];
  const lastMsg = msgs[0];
  const nickname = (presenceInfo && presenceInfo.nickname) || (lastMsg && lastPriv && lastPriv.senderNickname) || targetUser;
  currentChat = { type: 'private', target: targetUser };
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('messagesContainer').style.display = 'flex';
  document.getElementById('chatInput').style.display = 'flex';
  document.getElementById('chatHeader').style.display = 'flex';
  const avatar = document.getElementById('chatAvatar');
  avatar.style.display = 'flex';
  avatar.textContent = getInitials(nickname);
  document.getElementById('chatTitle').textContent = nickname;
  updateChatHeaderStatus();
  if (currentTab !== 'chats') switchTab('chats');
  renderSidebarList();
  renderMessages();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

function updateChatHeaderStatus() {
  if (currentChat.type !== 'private') return;
  const info = db.presence && db.presence[currentChat.target];
  const isOnline = info && info.online !== false && (Date.now() - (info.lastSeen || 0) < CONFIG.onlineTimeout);
  document.getElementById('chatSubtitle').textContent = isOnline ? '在线' : '离线';
  document.getElementById('chatSubtitle').style.color = isOnline ? 'var(--success)' : 'var(--text-muted)';
}

function renderMessages() {
  const container = document.getElementById('messagesContainer');
  container.innerHTML = '';
  let messages;
  if (currentChat.type === 'public') {
    messages = db.messages_public || [];
  } else if (currentChat.type === 'private') {
    const key = [currentUser.username, currentChat.target].sort().join('|');
    messages = (db.messages_private && db.messages_private[key]) || [];
  } else return;

  if (messages.length === 0 && currentChat.type === 'public') {
    const sysMsg = document.createElement('div');
    sysMsg.className = 'message system';
    sysMsg.innerHTML = `<div class="message-bubble">还没有消息，发送第一条消息开始聊天吧！</div>`;
    container.appendChild(sysMsg);
    return;
  }
  for (const msg of messages) {
    const msgEl = document.createElement('div');
    const isSelf = msg.sender === currentUser.username;
    msgEl.className = 'message' + (isSelf ? ' self' : '') + (msg.system ? ' system' : '');
    if (msg.system) {
      msgEl.innerHTML = `<div class="message-bubble">${escapeHtml(msg.text)}</div>`;
    } else {
      const info = db.presence && db.presence[msg.sender];
      const senderNickname = (info && info.nickname) || msg.senderNickname || msg.sender;
      msgEl.innerHTML = `
        <div class="avatar">${getInitials(senderNickname)}</div>
        <div class="message-content">
          <div class="message-meta">
            <span class="sender">${escapeHtml(isSelf ? '我' : senderNickname)}</span>
            <span>${formatTime(msg.ts)}</span>
          </div>
          <div class="message-bubble">${escapeHtml(msg.text)}</div>
        </div>
      `;
    }
    container.appendChild(msgEl);
  }
  requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
}

// ============ 发送消息 ============
async function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text) return;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  const message = {
    id: 'm' + Date.now() + Math.random().toString(36).slice(2, 6),
    sender: currentUser.username,
    senderNickname: currentUser.nickname,
    text,
    ts: Date.now(),
  };

  if (currentChat.type === 'public') {
    const ok = await updateDB(fresh => {
      if (!fresh.messages_public) fresh.messages_public = [];
      fresh.messages_public.push(message);
      // 只保留最近 100 条
      if (fresh.messages_public.length > 100) fresh.messages_public = fresh.messages_public.slice(-100);
      return fresh;
    });
    if (ok) {
      prevMsgCount = (db.messages_public || []).length;
      input.value = '';
      autoResize(input);
      renderMessages();
      renderSidebarList();
    } else {
      showToast('发送失败，请重试', 'error');
    }
  } else if (currentChat.type === 'private') {
    const otherUser = currentChat.target;
    const key = [currentUser.username, otherUser].sort().join('|');
    message.recipient = otherUser;
    const ok = await updateDB(fresh => {
      if (!fresh.messages_private) fresh.messages_private = {};
      if (!fresh.messages_private[key]) fresh.messages_private[key] = [];
      fresh.messages_private[key].push(message);
      if (fresh.messages_private[key].length > 100) fresh.messages_private[key] = fresh.messages_private[key].slice(-100);
      return fresh;
    });
    if (ok) {
      input.value = '';
      autoResize(input);
      renderMessages();
      renderSidebarList();
    } else {
      showToast('发送失败，请重试', 'error');
    }
  }
  sendBtn.disabled = false;
}

function handleTyping() {

// ============ 辅助 ============
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}

// ============ 事件绑定 ============
document.getElementById('registerForm').addEventListener('submit', handleRegister);
document.getElementById('loginForm').addEventListener('submit', handleLogin);
const messageInput = document.getElementById('messageInput');
messageInput.addEventListener('input', () => autoResize(messageInput));
messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

window.addEventListener('beforeunload', () => {
